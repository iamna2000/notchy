<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: flex-start;
  }

  /* ===== Viên thuốc ===== */
  .island {
    background: #000;
    color: #fff;
    width: 190px;
    height: 34px;
    border-radius: 0 0 18px 18px;
    overflow: hidden;
    position: relative;
    will-change: width, height, border-radius;
    transition:
      width 0.55s cubic-bezier(0.34, 1.45, 0.64, 1),
      height 0.55s cubic-bezier(0.34, 1.45, 0.64, 1),
      border-radius 0.55s cubic-bezier(0.34, 1.45, 0.64, 1);
  }
  .island.open {
    width: 400px;
    height: 150px;
    border-radius: 0 0 34px 34px;
  }

  /* ===== Nội dung thu gọn ===== */
  .compact {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    font-size: 13px; font-weight: 600;
    opacity: 1;
    transition: opacity 0.25s ease 0.15s;
  }
  .island.open .compact { opacity: 0; transition-delay: 0s; pointer-events: none; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #30d158;
    box-shadow: 0 0 8px #30d158;
  }

  /* ===== Nội dung mở rộng ===== */
  .expanded {
    position: absolute; inset: 0;
    padding: 22px 30px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    opacity: 0;
    transform: scale(0.92);
    transition: opacity 0.2s ease, transform 0.45s cubic-bezier(0.34, 1.45, 0.64, 1);
  }
  .island.open .expanded {
    opacity: 1;
    transform: scale(1);
    transition-delay: 0.12s;
  }
  .time { font-size: 48px; font-weight: 300; letter-spacing: 1px; }
  .date { margin-top: 4px; font-size: 14px; color: #a1a1a6; }
  .hint { margin-top: 10px; font-size: 11px; color: #636366; }
</style>
</head>
<body>
  <div class="stage">
    <div class="island" id="island">
      <div class="compact"><span class="dot"></span><span id="smallTime">--:--</span></div>
      <div class="expanded">
        <div class="time" id="bigTime">--:--</div>
        <div class="date" id="date"></div>
        <div class="hint">Chuột phải để thoát • Ctrl+Alt+Q</div>
      </div>
    </div>
  </div>

<script>
  const { ipcRenderer } = require('electron');
  const island = document.getElementById('island');
  const smallTime = document.getElementById('smallTime');
  const bigTime = document.getElementById('bigTime');
  const dateEl = document.getElementById('date');

  // ----- Đồng hồ -----
  function tick() {
    const d = new Date();
    const hm = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false });
    smallTime.textContent = hm;
    bigTime.textContent = hm;
    dateEl.textContent = d.toLocaleDateString('vi-VN', {
      weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric'
    });
  }
  tick();
  setInterval(tick, 1000);

  // ----- Hover: mở / đóng -----
  let closeTimer = null;
  island.addEventListener('mouseenter', () => {
    clearTimeout(closeTimer);
    ipcRenderer.send('set-clickable', true);
    island.classList.add('open');
  });
  island.addEventListener('mouseleave', () => {
    closeTimer = setTimeout(() => {
      island.classList.remove('open');
      ipcRenderer.send('set-clickable', false);
    }, 250);
  });

  // ----- Chuột phải để thoát -----
  island.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    ipcRenderer.send('quit-app');
  });
</script>
</body>
</html>
