<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'" />
<title>Notchy</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="stage">
  <div class="island" id="island" data-mode="compact">
    <div class="ear l"></div>
    <div class="ear r"></div>
    <div class="shell">

      <!-- ===== Thu gọn ===== -->
      <div class="compact" id="compact" data-act="c-open">
        <div class="c-left" id="cLeft"></div>
        <div class="c-center" id="cCenter">--:--</div>
        <div class="c-right" id="cRight"></div>
      </div>

      <!-- ===== Mở rộng ===== -->
      <div class="expanded" id="expanded">
        <nav class="topbar">
          <div class="tb-grp">
            <button class="tb" data-tab="music" title="Nhạc"></button>
            <button class="tb" data-tab="weather" title="Thời tiết"></button>
            <button class="tb tb-date" data-tab="calendar" title="Lịch"><span id="tbDate">--</span></button>
          </div>
          <div class="tb-grp">
            <button class="tb" data-tab="clip" title="Bảng tạm"></button>
            <button class="tb" data-tab="shelf" title="Kệ tạm (kéo thả tệp)"></button>
            <button class="tb" data-tab="sys" title="Hệ thống"></button>
            <span class="tb-sep" aria-hidden="true"></span>
            <button class="tb-upd" id="tbUpd" data-act="install-update" hidden>Cập nhật</button>
            <button class="tb tb-set" data-act="open-settings" id="tbSet" title="Cài đặt" aria-label="Cài đặt"></button>
          </div>
        </nav>

        <div class="views">

          <!-- Nhạc -->
          <section class="view" data-view="music">
            <div id="musicBody"></div>
            <div class="m-out" id="musicOut"></div>
          </section>

          <!-- Hệ thống: CPU / RAM / GPU / Mạng -->
          <section class="view" data-view="sys">
            <div class="st-grid" id="stGrid"></div>
          </section>

          <!-- Lịch -->
          <section class="view" data-view="calendar">
            <div class="cal-head">
              <div class="cal-ttl"><span class="ci" id="calIco"></span><span id="calTitle"></span></div>
              <div class="cal-nav">
                <button class="cal-exp" data-act="cal-toggle" id="calExp" title="Xem cả tháng / thu gọn"></button>
                <button class="cal-today" data-act="cal-today" id="calTodayBtn">Hôm nay</button>
                <button class="ib-s" data-act="cal-prev" id="calPrev"></button>
                <button class="ib-s" data-act="cal-next" id="calNext"></button>
              </div>
            </div>
            <div id="calBody"></div>
            <div class="dt-head" id="dtHead"></div>
            <div class="notes" id="notes"></div>
            <!-- Thu gọn: một nút; bấm thì khung soạn ghi chú trượt mở -->
            <div class="note-add" id="noteAdd">
              <button class="na-open" data-act="nc-open"><i id="ncPlus"></i><span>Thêm ghi chú…</span></button>
            </div>
            <!-- Khung soạn / sửa ghi chú: nội dung · bánh xe giờ · Lưu / Huỷ, dưới là liên kết + nhắc trước -->
            <div class="nc" id="nc">
              <div><div class="nc-grid">
                <label class="nc-text-w"><span class="sr">Nội dung ghi chú</span><textarea class="nc-text" id="ncText" maxlength="200" placeholder="Nội dung ghi chú" spellcheck="false"></textarea></label>
                <div class="drum" id="drum" aria-label="Giờ nhắc">
                  <div class="dcol" id="dH" data-seg="h" role="listbox" aria-label="Giờ"></div>
                  <span class="dsep">:</span>
                  <div class="dcol" id="dM" data-seg="m" role="listbox" aria-label="Phút"></div>
                </div>
                <div class="nc-btns">
                  <button class="nc-save" data-act="nc-save" id="ncSave">Lưu</button>
                  <button class="nc-cancel" data-act="nc-cancel">Huỷ</button>
                </div>
                <label class="nc-link"><i id="ncLinkIco"></i><span class="sr">Liên kết</span><input id="ncLink" placeholder="Liên kết (không bắt buộc)" spellcheck="false" maxlength="500" /></label>
                <div class="nc-rem" id="ncRem">
                  <button class="nc-rem-main" data-act="nc-rem" id="ncRemBtn" title="Đổi thời điểm nhắc"><i id="ncRemIco"></i><span id="ncRemTxt">Đúng giờ</span></button>
                  <button class="nc-rem-x" data-act="nc-rem-off" id="ncRemX" aria-label="Không nhắc"></button>
                </div>
              </div></div>
            </div>
          </section>

          <!-- Thời tiết: hiện tại → lưu ý (tối đa 3 dòng) → dự báo 7 ngày -->
          <section class="view" data-view="weather">
            <div class="wx-wrap" id="wxWrap"></div>
          </section>

          <!-- Bảng tạm -->
          <section class="view" data-view="clip">
            <div class="clip-head">
              <div class="clip-ttl">Bảng tạm</div>
              <div class="clip-tools">
                <button class="ib-s" data-act="clip-pause" id="clipPauseBtn" title="Tạm dừng ghi bảng tạm"></button><button class="ib-s" data-act="clip-clear" id="clipClearBtn" title="Xóa lịch sử (giữ mục đã ghim)"></button>
                <div class="search"><input id="clipQ" placeholder="Tìm kiếm" spellcheck="false" title="↑/↓ chọn · Enter chép · Esc xóa" /><button class="x" data-act="clip-q-clear" id="clipQx"></button></div>
              </div>
            </div>
            <div class="clip-pins" id="clipPins"></div>
            <div class="clip-list" id="clipList"></div>
          </section>

          <!-- Kệ tạm -->
          <section class="view" data-view="shelf">
            <div class="clip-head">
              <div class="clip-ttl">Kệ tạm <span class="sh-meta" id="shelfMeta"></span></div>
              <div class="clip-tools"><button class="cal-exp" data-act="shelf-exp" id="shelfExp"></button><button class="ib-s" data-act="shelf-clear" id="shelfClearBtn" title="Xóa hết khỏi kệ (không xóa tệp thật)"></button></div>
            </div>
            <div class="shelf-list" id="shelfList"></div>
          </section>
        </div>
      </div>

      <!-- ===== Thông báo ngắn (sạc, pin yếu, tải xong, tai nghe...) ===== -->
      <div class="notice-view" id="noticeView">
        <div class="n-ico" id="nIcon"></div>
        <div class="n-txt"><div class="n-title" id="nTitle"></div><div class="n-sub" id="nSub"></div></div>
        <span class="n-more" id="nMore" title="Thông báo đang chờ"></span>
      </div>

      <!-- ===== Đổ chuông ===== -->
      <div class="ring-view" id="ringView">
        <div class="ring-row">
          <div class="ring-icon" id="ringIcon"></div>
          <div class="ring-text">
            <div class="ring-title" id="ringTitle">Nhắc</div>
            <div class="ring-sub" id="ringSub"></div>
          </div>
        </div>
        <div class="ring-actions">
          <button class="pbtn tint" id="ringSnooze" data-act="ring-snooze">Báo lại sau 5 phút</button>
          <button class="pbtn tint" id="ringLink" data-act="ring-link" hidden>Mở liên kết</button>
          <button class="pbtn light" id="ringStop" data-act="ring-stop">Xong</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="lunar.js"></script>
<script src="wx-logic.js"></script>
<script src="app.js"></script>
</body>
</html>
