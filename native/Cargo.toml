[package]
name = "di-native"
version = "0.1.0"
edition = "2021"
description = "Cầu nối native (Windows) cho Notchy: thay các script PowerShell trong scripts/"

# di-media: thay scripts/media.ps1 (nhạc, ảnh bìa, điều khiển phát, cửa sổ che, toàn màn hình, dán, mở trình phát)
[[bin]]
name = "di-media"
path = "src/media.rs"

[dependencies]
serde_json = "1"
base64 = "0.22"

[dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
